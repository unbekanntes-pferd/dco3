name: release

# publish to crates.io on version tags (e.g. v0.21.0) via trusted publishing, then create the GitHub release
# dco3_derive is published first, but only if its version is not on crates.io yet
# requires a crates.io trusted publisher for both crates (dco3, dco3_derive):
# repository unbekanntes-pferd/dco3, workflow release.yml, environment crates.io
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: stable
    - name: Check tag matches crate version
      run: |
        version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "dco3") | .version')
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match crate version $version"
          exit 1
        fi
    - name: Run tests
      run: cargo test --workspace --all-features --locked
    - name: Package crates
      run: cargo package --workspace --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates.io
      url: https://crates.io/crates/dco3
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: stable
    - name: Get a crates.io token (trusted publishing)
      id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
    - name: Publish dco3_derive if this version is not on crates.io yet
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "dco3_derive") | .version')
        # run outside the workspace, otherwise cargo info reports the local package
        if out=$(cd "$RUNNER_TEMP" && cargo info --registry crates-io "dco3_derive@$version" 2>&1); then
          echo "dco3_derive $version is already published - skipping"
        elif grep -q "could not find" <<<"$out"; then
          cargo publish --locked -p dco3_derive
        else
          echo "$out"
          exit 1
        fi
    - name: Publish dco3
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish --locked -p dco3

  github-release:
    # release page entry with generated notes
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
